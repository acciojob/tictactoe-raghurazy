<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    body { font-family: sans-serif; text-align: center; margin: 30px; }
    .container { max-width: 500px; margin: auto; }
    input { margin: 5px; padding: 5px; }
    #submit { padding: 5px 10px; }
    .board { display: grid; grid-template-columns: repeat(3, 100px); grid-gap: 5px; margin: 20px auto; }
    .cell { width: 100px; height: 100px; background-color: #f0f0f0; font-size: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .message { margin: 20px 0; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tic Tac Toe</h1>

    <!-- Player input form -->
    <div id="playerForm">
      <input type="text" id="player1" placeholder="Player 1 Name">
      <input type="text" id="player2" placeholder="Player 2 Name">
      <button id="submit">Start Game</button>
    </div>

    <!-- Message div -->
    <div class="message" id="message" style="display:none;"></div>

    <!-- Tic Tac Toe board -->
    <div class="board" id="board" style="display:none;">
      <div class="cell" id="1"></div>
      <div class="cell" id="2"></div>
      <div class="cell" id="3"></div>
      <div class="cell" id="4"></div>
      <div class="cell" id="5"></div>
      <div class="cell" id="6"></div>
      <div class="cell" id="7"></div>
      <div class="cell" id="8"></div>
      <div class="cell" id="9"></div>
    </div>
  </div>
